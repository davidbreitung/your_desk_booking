name: Desk Booking validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s desk-booking/tests -q
      - run: node --test desk-booking/tests/*.test.mjs
      - run: python desk-booking/documentation.py --check
      - run: python desk-booking/package_m365.py
      - name: Verify mandatory project files
        run: |
          test -s AGENTS.md
          test -s REQUIREMENTS.md
          test -s STATUS.md
          test -s docs/USER_MANUAL.md
          test -s docs/ADMIN_MANUAL.md
