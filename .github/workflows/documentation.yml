name: Documentation consistency
on:
  pull_request:
  push:
    branches: [main]
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mandatory project files
        run: |
          test -s AGENTS.md
          test -s REQUIREMENTS.md
          test -s STATUS.md
          test -s README.md
      - name: Check documentation accompanies integration changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          if printf '%s\n' "$changed" | grep -q '^custom_components/'; then
            printf '%s\n' "$changed" | grep -qx 'STATUS.md' || { echo 'Update STATUS.md when integration code changes'; exit 1; }
          fi
