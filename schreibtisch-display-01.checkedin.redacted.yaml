          { int index = 0;
            if (enabled[0]) {
              lv_obj_clear_flag(id(light_nav_2_1), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(light_nav_2_1), (index++ * 56) - ((count - 1) * 28));
            } else lv_obj_add_flag(id(light_nav_2_1), LV_OBJ_FLAG_HIDDEN);
            if (enabled[1]) {
