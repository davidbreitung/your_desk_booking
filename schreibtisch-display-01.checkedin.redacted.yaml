binary_sensor:
  - platform: homeassistant
    id: standby_return_home
    entity_id: sensor.schreibtisch_01_belegung
    attribute: standby_home
    internal: true
  - platform: homeassistant
    id: cover_available
    entity_id: sensor.schreibtisch_01_belegung
    attribute: cover_available
    internal: true
  - platform: homeassistant
    id: cover_has_tilt
    entity_id: sensor.schreibtisch_01_belegung
    attribute: cover_tilt
    internal: true
    on_state:
      - lambda: |-
          if (x) {
            lv_obj_clear_flag(id(cover_tilt_slider), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(cover_tilt_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(cover_tilt_select), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(cover_tilt_slider), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(cover_tilt_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(cover_tilt_select), LV_OBJ_FLAG_HIDDEN);
            id(cover_tilt_focus) = false;
          }
  - platform: gpio
    id: ring_button
    internal: true
    pin:
      pcf8574: pcf
      number: 5
      mode: {input: true}
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_press:
      - script.execute: display_wake
      - if:
          condition:
            lambda: |-
              return !id(message_open) && id(display_enabled).state;
          then:
            - if:
                condition:
                  lambda: |-
                    return id(menu_selection);
                then:
                  - lambda: |-
                      id(menu_selection) = false;
                  - script.execute: show_menu_page
                else:
                  - lambda: |-
                      id(menu_selection) = true;
            - script.execute: render_main_navigation

script:
  - id: render_main_navigation
    then:
      - lambda: |-
          if (id(menu_booking) == nullptr || id(menu_switch) == nullptr) return;
          const bool enabled[] = {true, !id(dimmer_page)->skip, true, !id(cover_page)->skip, !id(switch_page)->skip};
          lv_obj_t *buttons[] = {id(menu_booking), id(menu_dimmer), id(menu_height), id(menu_cover), id(menu_switch)};
          if (!enabled[id(menu_index)]) id(menu_index) = 0;
          id(render_desk_status).execute();
          int count = 0, position = 0;
          for (bool e : enabled) if (e) ++count;
          for (int i = 0; i < 5; ++i) {
            if (!enabled[i]) { lv_obj_add_flag(buttons[i], LV_OBJ_FLAG_HIDDEN); continue; }
            lv_obj_clear_flag(buttons[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(buttons[i], position++ * 60 - (count - 1) * 30);
            bool selected = i == id(menu_index);
            lv_obj_set_style_border_width(buttons[i], selected ? 3 : 0, LV_PART_MAIN);
            lv_obj_set_style_border_color(buttons[i], lv_color_hex(id(menu_selection) ? 0x999999 : 0x00D2FF), LV_PART_MAIN);
          }
  - id: show_menu_page
    then:
      - if:
          condition:
            lambda: |-
              return id(menu_index) == 0;
          then:
            - lvgl.page.show: booking_page
      - if:
          condition:
            lambda: |-
              return id(menu_index) == 1;
          then:
            - lvgl.page.show: dimmer_page
      - if:
          condition:
            lambda: |-
              return id(menu_index) == 2;
          then:
            - lvgl.page.show: height_page
      - if:
          condition:
            lambda: |-
              return id(menu_index) == 3;
          then:
            - lvgl.page.show: cover_page
      - if:
          condition:
            lambda: |-
              return id(menu_index) == 4;
          then:
            - lvgl.page.show: switch_page
      - script.execute: render_main_navigation
  - id: standby_home_page
    then:
      - lambda: |-
          id(menu_index) = 0;
          id(menu_selection) = true;
      - script.execute: show_menu_page
  - id: rotate_dashboard
    parameters:
      direction: int
    then:
      - script.execute: display_wake
      - if:
          condition:
            lambda: |-
              return !id(message_open) && id(display_enabled).state;
          then:
            - if:
                condition:
                  lambda: |-
                    return id(menu_selection);
                then:
                  - lambda: |-
                      const bool enabled[] = {true, !id(dimmer_page)->skip, true, !id(cover_page)->skip, !id(switch_page)->skip};
                      do { id(menu_index) = (id(menu_index) + direction + 5) % 5; } while (!enabled[id(menu_index)]);
                  - script.execute: render_main_navigation
                else:
                  - if:
                      condition:
                        lvgl.page.is_showing: dimmer_page
                      then:
                        - lvgl.arc.update:
                            id: dimmer_arc
                            value: !lambda |-
                              return std::max(0, std::min(100, (int)lv_arc_get_value(id(dimmer_arc)) + direction * 5));
                  - if:
                      condition:
                        lvgl.page.is_showing: dimmer_page_2
                      then:
                        - lvgl.arc.update:
                            id: dimmer_arc_2
                            value: !lambda |-
                              return std::max(0, std::min(100, (int)lv_arc_get_value(id(dimmer_arc_2)) + direction * 5));
                  - if:
                      condition:
                        lvgl.page.is_showing: dimmer_page_3
                      then:
                        - lvgl.arc.update:
                            id: dimmer_arc_3
                            value: !lambda |-
                              return std::max(0, std::min(100, (int)lv_arc_get_value(id(dimmer_arc_3)) + direction * 5));
                  - if:
                      condition:
                        lvgl.page.is_showing: dimmer_page_4
                      then:
                        - lvgl.arc.update:
                            id: dimmer_arc_4
                            value: !lambda |-
                              return std::max(0, std::min(100, (int)lv_arc_get_value(id(dimmer_arc_4)) + direction * 5));
                  - if:
                      condition:
                        lvgl.page.is_showing: height_page
                      then:
                        - lvgl.arc.update:
                            id: height_arc
                            value: !lambda |-
                              return std::max(62, std::min(128, (int)lv_arc_get_value(id(height_arc)) + direction * 1));
                  - if:
                      condition:
                        lambda: |-
                          return id(cover_page)->is_showing() && id(cover_available).state;
                      then:
                        - if:
                            condition:
                              lambda: |-
                                return id(cover_tilt_focus) && id(cover_has_tilt).state;
                            then:
                              - lvgl.slider.update:
                                  id: cover_tilt_slider
                                  value: !lambda |-
                                    return std::max(0, std::min(100, (int)lv_slider_get_value(id(cover_tilt_slider)) + direction * 5));
                            else:
                              - lvgl.slider.update:
                                  id: cover_position_slider
                                  value: !lambda |-
                                    return std::max(0, std::min(100, (int)lv_slider_get_value(id(cover_position_slider)) + direction * 5));
                  - if:
                      condition:
                        lvgl.page.is_showing: switch_page
                      then:
                        - event.trigger:
                            id: switch_command
                            event_type: !lambda |-
                              return direction > 0 ? "turn_on" : "turn_off";
  - id: render_light_navigation
    then:
      - script.execute: render_main_navigation
      - lambda: |-
          const bool enabled[] = { !id(dimmer_page)->skip, !id(dimmer_page_2)->skip, !id(dimmer_page_3)->skip, !id(dimmer_page_4)->skip };
          int count = 0;
          for (bool value : enabled) if (value) ++count;
          if (count > 1) lv_obj_clear_flag(id(light_nav_1), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(light_nav_1), LV_OBJ_FLAG_HIDDEN);
          { int index = 0;
            if (enabled[0]) {
              lv_obj_clear_flag(id(light_nav_1_1), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(light_nav_1_1), (index++ * 56) - ((count - 1) * 28));
            } else lv_obj_add_flag(id(light_nav_1_1), LV_OBJ_FLAG_HIDDEN);
            if (enabled[1]) {
              lv_obj_clear_flag(id(light_nav_1_2), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(light_nav_1_2), (index++ * 56) - ((count - 1) * 28));
            } else lv_obj_add_flag(id(light_nav_1_2), LV_OBJ_FLAG_HIDDEN);
            if (enabled[2]) {
