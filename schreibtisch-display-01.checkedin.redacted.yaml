              lv_obj_set_x(id(light_nav_2_4), (index++ * 56) - ((count - 1) * 28));
            } else lv_obj_add_flag(id(light_nav_2_4), LV_OBJ_FLAG_HIDDEN);
          }
          if (count > 1) lv_obj_clear_flag(id(light_nav_3), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(light_nav_3), LV_OBJ_FLAG_HIDDEN);
          { int index = 0;
