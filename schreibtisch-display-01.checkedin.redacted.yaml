              lv_obj_clear_flag(id(light_nav_4_2), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(light_nav_4_2), (index++ * 56) - ((count - 1) * 28));
            } else lv_obj_add_flag(id(light_nav_4_2), LV_OBJ_FLAG_HIDDEN);
            if (enabled[2]) {
              lv_obj_clear_flag(id(light_nav_4_3), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(light_nav_4_3), (index++ * 56) - ((count - 1) * 28));
            } else lv_obj_add_flag(id(light_nav_4_3), LV_OBJ_FLAG_HIDDEN);
            if (enabled[3]) {
              lv_obj_clear_flag(id(light_nav_4_4), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(id(light_nav_4_4), (index++ * 56) - ((count - 1) * 28));
            } else lv_obj_add_flag(id(light_nav_4_4), LV_OBJ_FLAG_HIDDEN);
          }
  - id: render_desk_status
    mode: restart
    then:
      - lambda: |-
          const auto &status = id(desk_status_from_ha).state;
          const bool valid = id(desk_data_valid);
          const bool free = valid && status == "free";
          const bool occupied = valid && status == "checked_in";
          // Static full-circle border and shadow: no animation or spinner.
          const bool booking_fresh = id(next_booking_received) != 0 && (uint32_t)(millis() - id(next_booking_received)) < 90000;
          const bool booking_warn = booking_fresh && id(next_booking_warning);
          const bool reservation_active = booking_fresh && id(booking_active);
          const uint32_t ring_color = reservation_active ? 0xFF3B30 : booking_warn ? 0xFFD43B : 0x36FF7F;
          lv_obj_set_style_border_color(id(desk_free_ring), lv_color_hex(ring_color), LV_PART_MAIN);
          lv_obj_set_style_shadow_color(id(desk_free_ring), lv_color_hex(ring_color), LV_PART_MAIN);
          lv_label_set_text(id(next_booking_time_label), booking_fresh ? id(next_booking_time).c_str() : "Buchungen nicht aktuell");
          lv_label_set_text(id(next_booking_who_label), !occupied && booking_fresh ? id(next_booking_who).c_str() : "");
          if (!occupied && (free || booking_warn || reservation_active) && !id(message_open)) lv_obj_clear_flag(id(desk_free_ring), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(desk_free_ring), LV_OBJ_FLAG_HIDDEN);
          const char *headline = "STATUS OFFEN";
          const char *hint = "Verbindung zu Home Assistant";
          uint32_t color = 0xFFCB70;
          std::string name;
          if (free) {
            headline = "FREI";
            hint = "Check-in in Home Assistant";
            color = 0x36FF7F;
          } else if (occupied) {
            headline = "EINGECHECKT";
            hint = "Dein Arbeitsplatz";
            color = 0x3399FF;
            const auto &employee = id(desk_employee_from_ha).state;
            if (id(desk_name_valid) && !employee.empty() && employee != "unknown" && employee != "unavailable" && employee != "—") name = employee;
            else name = "Name wird geladen";
          } else if (valid && status == "applying") {
            headline = "BITTE WARTEN";
            hint = "Check-in wird aktualisiert";
          } else if (valid && status == "error") {
            headline = "BITTE PRUEFEN";
            hint = "Status in Home Assistant pruefen";
          }
          if (!occupied && (reservation_active || (free && booking_warn))) {
            headline = "RESERVIERT";
            color = reservation_active ? 0xFF3B30 : 0xFFD43B;
            hint = reservation_active ? "Reservierung laeuft" : "Reservierung beginnt bald";
          }
          lv_label_set_text(id(desk_status_label), headline);
          lv_obj_set_style_text_color(id(desk_status_label), lv_color_hex(color), LV_PART_MAIN);
          lv_label_set_text(id(desk_employee_label), name.c_str());
          lv_label_set_text(id(desk_hint_label), hint);
          lv_label_set_text(id(desk_name_header), name.c_str());
          if (occupied && id(menu_index) != 0) lv_obj_clear_flag(id(desk_name_header), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(desk_name_header), LV_OBJ_FLAG_HIDDEN);
  - id: display_wake
    mode: restart
    then:
      - lambda: |-
          if (!id(display_enabled).state) return;
          id(display_last_activity) = millis();
          id(display_is_standby) = false;
          float value = id(display_brightness).state;
          auto call = id(display_backlight).turn_on();
          call.set_brightness((std::isnan(value) ? 50.0f : std::max(1.0f, std::min(100.0f, value))) / 100.0f);
          call.set_transition_length(0);
          call.perform();
  - id: change_page
    mode: single
    then:
      - delay: 50ms
      - if:
          condition:
            lambda: |-
              return !id(message_open);
          then:
            - if:
                condition:
                  lambda: |-
                    return id(swipe_direction) > 0;
                then:
                  - lvgl.page.next:
                      animation: MOVE_LEFT
                      time: 200ms
                else:
                  - lvgl.page.previous:
                      animation: MOVE_RIGHT
                      time: 200ms
      - lambda: |-
          id(swipe_direction) = 0; id(menu_selection) = false;
      - script.execute: render_main_navigation
  - id: dismiss_message
    then:
      - script.stop: message_countdown
      - lvgl.widget.hide: message_overlay
      - globals.set:
          id: message_open
          value: 'false'
      - script.execute: render_desk_status
  - id: message_countdown
    mode: restart
    then:
      - lvgl.widget.hide: desk_free_ring
      - if:
          condition:
            lambda: |-
              return id(booking_message) || id(message_priority).current_option() == "1" || id(message_priority).current_option() == "2";
          then:
            - lvgl.spinner.update:
                id: message_priority_ring
                arc_color: !lambda |-
                  return lv_color_hex(id(booking_message) ? 0x36FF7F : (id(message_priority).current_option() == "1" ? 0xFF3030 : 0xFFD230));
                indicator:
                  arc_color: !lambda |-
                    return lv_color_hex(id(booking_message) ? 0x36FF7F : (id(message_priority).current_option() == "1" ? 0xFF3030 : 0xFFD230));
            - lvgl.widget.show: message_priority_ring
          else:
            - lvgl.widget.hide: message_priority_ring
      - lambda: |-
          float seconds = id(message_timeout).state;
          id(message_seconds_left) = std::isnan(seconds) ? 15 : std::max(1, std::min(300, (int)seconds));
      - lvgl.label.update:
          id: message_ok_label
          text: !lambda |-
            return str_sprintf("OK (%d)", id(message_seconds_left));
      - while:
          condition:
            lambda: |-
              return id(message_open) && id(message_seconds_left) > 0;
          then:
            - delay: 1s
            - lambda: |-
                id(message_seconds_left)--;
            - lvgl.label.update:
                id: message_ok_label
                text: !lambda |-
                  return str_sprintf("OK (%d)", id(message_seconds_left));
      - lvgl.widget.hide: message_overlay
      - globals.set:
          id: message_open
          value: 'false'
      - script.execute: render_desk_status

