interval:
  - interval: 5s
    then:
      - lambda: |-
          if (id(next_booking_received) != 0 && (uint32_t)(millis() - id(next_booking_received)) >= 90000) {
            id(next_booking_received) = 0;
            id(next_booking_warning) = false;
            id(render_desk_status).execute();
          }
  - interval: 1s
    then:
      - lambda: |-
          if (!id(display_enabled).state) return;
          // Keep notifications bright; start a full idle period after they close.
          if (id(message_open)) {
            id(display_last_activity) = millis();
            return;
          }
          float timeout = id(display_standby_timeout).state;
          if (std::isnan(timeout) || timeout <= 0 || id(display_is_standby)) return;
          if ((uint32_t)(millis() - id(display_last_activity)) < (uint32_t)(timeout * 1000.0f)) return;
          float normal = id(display_brightness).state;
          float dimmed = id(display_standby_brightness).state;
          if (std::isnan(normal)) normal = 50.0f;
          if (std::isnan(dimmed)) dimmed = 10.0f;
          dimmed = std::max(0.0f, std::min(normal, dimmed));
          id(display_is_standby) = true;
          if (id(standby_return_home).state) id(standby_home_page).execute();
          auto call = id(display_backlight).turn_on();
          call.set_brightness(dimmed / 100.0f);
          call.set_transition_length(500);
          call.perform();

