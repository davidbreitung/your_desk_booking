# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  includes:
    - display_resources.h
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      - output.turn_on: touch_int_release
      - output.turn_on: lcd_power
      - output.turn_on: display_reset
      - delay: 100ms
      - output.turn_off: display_reset
      - delay: 600ms
      - script.execute: display_wake
      - script.execute: render_main_navigation
  name: schreibtisch-display-01
  friendly_name: Schreibtisch Display 01

esp32:
  variant: esp32s3
  flash_size: 16MB
  partitions: display-partitions-expanded.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
      CONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

debug:
  update_interval: 30s

logger:

api:
  on_client_disconnected:
    - lambda: |-
        if (client_info.rfind("Home Assistant", 0) == 0) {
          id(desk_data_valid) = false;
          id(desk_name_valid) = false;
          id(render_desk_status).execute();
        }
  actions:
    - action: nachricht_anzeigen
      variables:
        nachricht: string
      then:
        - lambda: |-
            id(booking_message) = false;
        - globals.set:
            id: message_open
            value: 'true'
        - lvgl.label.update:
            id: message_text
            text: !lambda |-
              return nachricht;
        - lvgl.widget.show: message_overlay
        - script.execute: message_countdown
        - lvgl.resume:
        - script.execute: display_wake
  encryption:
    key: !secret desk_display_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret desk_display_password
  ap:
    ssid: Schreibtisch Di Fallback Hotspot
    password: !secret desk_display_password

  use_address: 192.0.2.10
captive_portal:

# Elecrow DHE03921D: example/esphome/Lesson05/21-touch.yaml
# Existing Wi-Fi secrets, API encryption and OTA settings are preserved above.
psram:
  mode: octal
  speed: 80MHz

i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a
  scan: true

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: GPIO6
    id: bl_pwm
    frequency: 19531Hz
  - platform: gpio
    id: touch_int_release
    pin:
      pcf8574: pcf
      number: 2
      mode: {output: true}
      inverted: false
  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode: {output: true}
      inverted: false
  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode: {output: true}
      inverted: true

light:
  - platform: monochromatic
    name: "LCD Backlight"
    id: display_backlight
    output: bl_pwm
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

spi:
  clk_pin: GPIO2
  mosi_pin: GPIO1

display:
  - platform: st7701s
    id: my_display
    auto_clear_enabled: false
    update_interval: never
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO16
    de_pin: GPIO40
    hsync_pin: GPIO15
    vsync_pin: GPIO7
    pclk_pin: GPIO41
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    hsync_front_porch: 20
    hsync_pulse_width: 10
    hsync_back_porch: 10
    vsync_front_porch: 8
    vsync_pulse_width: 10
    vsync_back_porch: 10
    pclk_frequency: 18MHz
    pclk_inverted: true
    init_sequence:
      - [0x01]
      - delay 120ms
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0B, 0x02]
      - [0xC2, 0x00, 0x02]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x08]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms

touchscreen:
  - platform: cst816
    id: touch_panel
    display: my_display
    reset_pin:
      pcf8574: pcf
      number: 0
      mode: {output: true}
      inverted: false
    update_interval: 20ms
    on_touch:
      - script.execute: display_wake
      - lambda: |-
          id(swipe_direction) = 0;
    on_update:
      - script.execute: display_wake
      - lambda: |-
          if (id(message_open)) return;
          for (auto t : touches) {
            if (t.state < 1 || t.state > 2) continue;
            // Central swipe area leaves the outer value ring independently usable.
            if (t.x_org < 90 || t.x_org > 390 || t.y_org < 110 || t.y_org > 350) continue;
            if (id(cover_page)->is_showing() && t.y_org > 170) continue;
            int dx = (int)t.x - (int)t.x_org;
            int dy = (int)t.y - (int)t.y_org;
            if (abs(dx) >= 60 && abs(dx) > abs(dy) * 2)
              id(swipe_direction) = dx < 0 ? 1 : -1;
          }
    on_release:
      - script.execute: display_wake
      - if:
          condition:
            lambda: |-
              return !id(message_open) && id(swipe_direction) != 0;
          then:
            - script.execute: change_page

