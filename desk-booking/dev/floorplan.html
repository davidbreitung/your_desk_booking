<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Desk Booking – lokale Funktionsprüfung</title>
<style>body{margin:0;background:#e8eeed;font-family:Arial,sans-serif;color:#233a43}main{max-width:1150px;margin:28px auto;padding:0 16px}header{font-size:12px;letter-spacing:1px;margin-bottom:12px;color:#5b7178}ha-icon{display:inline-block}ha-icon:after{content:'▤';font-size:27px}h1{font-size:18px}</style>
<main><header>LOKALE VORSCHAU · SYNTHETISCHE TESTDATEN</header><desk-booking-floorplan></desk-booking-floorplan></main>
<script type="module">
import '/frontend/desk-booking-floorplan.js';
import {localDate,atMinute} from '/frontend/model.js';
const zone='Europe/Berlin',today=localDate(new Date(),zone), now=Date.now();
const canvas=document.createElement('canvas');canvas.width=1400;canvas.height=800;const c=canvas.getContext('2d');c.fillStyle='#f7f5ef';c.fillRect(0,0,1400,800);c.strokeStyle='#9baaa8';c.lineWidth=9;c.strokeRect(60,60,1280,680);c.beginPath();c.moveTo(900,60);c.lineTo(900,500);c.moveTo(900,610);c.lineTo(900,740);c.stroke();c.lineWidth=2;c.strokeStyle='#d7ddda';for(let y=80;y<740;y+=40){c.beginPath();c.moveTo(60,y);c.lineTo(1340,y);c.stroke();}c.font='24px Arial';c.fillStyle='#a1adaa';c.fillText('TEAM OFFICE',100,110);c.fillText('MEETING',950,110);c.fillStyle='#dce7db';for(const [x,y] of [[90,650],[1240,650]]){c.beginPath();c.arc(x,y,35,0,7);c.fill();}
const initial={id:'c0b1c2d3-1111-4222-8333-123456789012',revision:1,name:'Büro · Erdgeschoss',image:canvas.toDataURL('image/png'),aspect:1.75,items:[{resource_id:'desk-one',x:24,y:38,size:64,rotation:0,label:true},{resource_id:'desk-two',x:48,y:38,size:64,rotation:0,label:true},{resource_id:'desk-three',x:24,y:66,size:64,rotation:0,label:true},{resource_id:'room-one',x:79,y:45,size:76,rotation:0,label:true}]};
let plans=JSON.parse(localStorage.getItem('desk-booking-demo-plans')||'null')||{[initial.id]:initial};
const anna={id:'anna',name:'Anna Beispiel',device_id:null},ben={id:'ben',name:'Ben Muster',device_id:null};
function event(id,day,s,e,person){return {id,start:new Date(atMinute(day,s,zone)).toISOString(),end:new Date(atMinute(day,e,zone)).toISOString(),person,name:person.name,identity_status:'resolved'};}
const card=document.querySelector('desk-booking-floorplan');card.setConfig({type:'custom:desk-booking-floorplan',title:'Unser Büro',default_time:'09:00'});
card.hass={callWS:async m=>{const p=m.payload||{};if(m.action==='snapshot'){const day=p.date||today;let booked=[event('one',day,9*60,12*60,anna),event('two',day,14*60,17*60,ben)];if(day===today)booked=[{...booked[0],start:new Date(now+25*60000).toISOString(),end:new Date(now+85*60000).toISOString()}];return {date:day,today,timezone:zone,now:new Date().toISOString(),can_edit:!location.search.includes('viewer'),plans:Object.values(plans).map(({id,name,revision})=>({id,name,revision})),resources:[{id:'desk-one',name:'Schreibtisch 1',kind:'desk',active:true,fresh:true,checked_in:true,occupant:anna,events:booked},{id:'desk-two',name:'Schreibtisch 2',kind:'desk',active:true,fresh:true,events:booked},{id:'desk-three',name:'Schreibtisch 3',kind:'desk',active:true,fresh:true,events:[]},{id:'room-one',name:'Besprechungsraum',kind:'room',active:true,fresh:true,events:[event('room',day,9*60,18*60,ben)]}]};}if(m.action==='get')return structuredClone(plans[p.id]);if(m.action==='photo')return {image:null,status:'not_found'};if(m.action==='save'){const saved={...p,revision:(plans[p.id]?.revision||0)+1};plans[p.id]=saved;localStorage.setItem('desk-booking-demo-plans',JSON.stringify(plans));return structuredClone(saved);}throw new Error('Unknown');}};
</script></html>
